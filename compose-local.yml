# Local build of our fork, runs beside Home Assistant on this server.
# Rebuild after code changes (see Dockerfile.prebuilt for the host build step):
#   docker compose -f compose-local.yml up -d --build
services:
  ha-fusion:
    container_name: ha-fusion
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: ha-fusion:local
    volumes:
      - /home/len-ser-01/ha-fusion-data:/app/data
    ports:
      - "3015:5050"
    environment:
      TZ: Asia/Tehran
      HASS_URL: http://192.168.1.110:8123
    restart: unless-stopped
