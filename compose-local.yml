# Local build of our fork, runs beside Home Assistant on this server.
# Rebuild after code changes (see Dockerfile.prebuilt for the host build step):
#   docker compose -f compose-local.yml up -d --build
services:
  ha-fusion:
    container_name: ha-fusion
    build:
      context: .
      dockerfile: Dockerfile.prebuilt
    image: ha-fusion:local
    volumes:
      - /home/len-ser-01/ha-fusion-data:/app/data
      # long-lived HA token for the light effects engine (server side only, read-only)
      - /home/len-ser-01/.config/ha-fusion/ha_token:/run/secrets/ha_token:ro
    ports:
      - "3015:5050"
    environment:
      TZ: Europe/Berlin
      HASS_URL: http://192.168.1.110:8123
      HASS_TOKEN_FILE: /run/secrets/ha_token
      # hostnames that get the full Home Assistant UI instead of the dashboard
      HA_PUBLIC_HOSTS: ha.a-ll.site
    restart: unless-stopped
